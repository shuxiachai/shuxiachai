s="ch" style="animation-delay:2.260s">&amp;</tspan><tspan class="ch" style="animation-delay:2.315s"> </tspan><tspan class="ch" style="animation-delay:2.370s">R</tspan><tspan class="ch" style="animation-delay:2.425s">A</tspan><tspan class="ch" style="animation-delay:2.480s">G</tspan><tspan class="ch" style="animation-delay:2.535s"> </tspan><tspan class="ch" style="animation-delay:2.590s">a</tspan><tspan class="ch" style="animation-delay:2.645s">p</tspan><tspan class="ch" style="animation-delay:2.700s">p</tspan><tspan class="ch" style="animation-delay:2.755s">s</tspan></text>
  <rect class="cursor" x="580" y="173" width="11" height="21" fill="#22d3ee"/>

  <text x="72" y="240" class="mono" font-size="17" fill="#94a3b8"><tspan fill="#22d3ee">$</tspan> evidence --first <tspan fill="#a78bfa">&amp;&amp;</tspan> eval --pre-registered <tspan fill="#a78bfa">&amp;&amp;</tspan> publish --with-limits</text>

  <g class="mono" font-size="16">
    <line x1="938" y1="84" x2="938" y2="234" stroke="#334155" stroke-width="2"/>
    <circle class="halo" cx="938" cy="84" r="15"/>
    <circle class="halo h2" cx="938" cy="134" r="15"/>
    <circle class="halo h3" cx="938" cy="184" r="15"/>
    <circle class="halo h4" cx="938" cy="234" r="15"/>
    <circle class="dot" cx="938" cy="84" r="3.5" fill="#e2e8f0"/>
    <circle cx="938" cy="84" r="7" fill="#22d3ee"/>
    <circle cx="938" cy="134" r="7" fill="#38bdf8"/>
    <circle cx="938" cy="184" r="7" fill="#818cf8"/>
    <circle cx="938" cy="234" r="7" fill="#a78bfa"/>
    <text x="962" y="90" fill="#cbd5e1">retrieve<tspan fill="#64748b"> · code</tspan></text>
    <text x="962" y="140" fill="#cbd5e1">validate<tspan fill="#64748b"> · freeze</tspan></text>
    <text x="962" y="190" fill="#cbd5e1">reason<tspan fill="#64748b"> · 6 LLM stages</tspan></text>
    <text x="962" y="240" fill="#cbd5e1">score<tspan fill="#64748b"> · code</tspan></text>
  </g>
</svg>
