<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jingbo Chai · 柴靖博</title>
  <desc id="desc">AI Agent / LLM 应用开发。证据先行的 Agent 流程：代码检索并校验来源，6 个 LLM 阶段推理，代码计算评分。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0e1a2f"/>
      <stop offset="1" stop-color="#0a2b36"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", "Microsoft YaHei", "PingFang SC", monospace; }
    .ch { animation: show 0.01s steps(1, end) both; }
    .cursor { animation: type 2.31s steps(42, end) 0.5s both, blink 1.1s steps(1, end) 2.81s infinite; }
    .scan { opacity: 0; animation: sweep 7s linear 1s infinite; }
    .halo { fill: #22d3ee; opacity: 0; animation: pulse 4.8s ease-in-out infinite; }
    .h2 { animation-delay: 1.2s; }
    .h3 { animation-delay: 2.4s; }
    .h4 { animation-delay: 3.6s; }
    .dot { opacity: 0; animation: travel 4.8s ease-in-out infinite; }
    @keyframes show { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes type { from { transform: translateX(-504px); } to { transform: translateX(0); } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes sweep { from { opacity: 1; transform: translateY(-90px); } to { opacity: 1; transform: translateY(300px); } }
    @keyframes pulse { 0% { opacity: 0; } 10% { opacity: 0.45; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes travel { 0% { opacity: 0; transform: translateY(0); } 5% { opacity: 1; } 75% { opacity: 1; transform: translateY(150px); } 82%, 100% { opacity: 0; transform: translateY(150px); } }
    @media (prefers-reduced-motion: reduce) { .ch, .cursor, .scan, .halo, .dot { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect class="scan" width="1200" height="90" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>

  <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="6" fill="#febc2e"/>
  <circle cx="80" cy="32" r="6" fill="#28c840"/>
  <text x="104" y="37" class="mono" font-size="14" fill="#64748b">shuxiachai@github: ~/agents</text>
  <circle cx="1000" cy="32" r="4.5" fill="#28c840"/>
  <text x="1012" y="37" class="mono" font-size="14" fill="#64748b">open to work · 2027</text>

  <text x="72" y="124" class="sans" font-size="58" font-weight="700" fill="#e2e8f0">Jingbo Chai<tspan font-weight="400" fill="#94a3b8"> · 柴靖博</tspan></text>
  <rect x="74" y="144" width="120" height="4" rx="2" fill="url(#accent)"/>

