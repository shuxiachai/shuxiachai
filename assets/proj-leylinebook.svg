  <rect x="73.2" y="168" width="91.6" height="28" rx="7" fill="#0f1b2d" stroke="#334155"/><text x="81.2" y="187" class="mono" font-size="14" fill="#cbd5e1">IndexedDB</text>
  <rect x="172.8" y="168" width="66.4" height="28" rx="7" fill="#0f1b2d" stroke="#334155"/><text x="180.8" y="187" class="mono" font-size="14" fill="#cbd5e1">SQLite</text>
  <rect x="247.2" y="168" width="125.2" height="28" rx="7" fill="#0f1b2d" stroke="#334155"/><text x="255.2" y="187" class="mono" font-size="14" fill="#cbd5e1">offline-first</text>
