<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210" role="img" aria-labelledby="t d">
  <title id="t">LeyLineBook</title>
  <desc id="d">地脉簿 LeyLineBook 多账号任务管理工具：在电脑和手机上管理多个《原神》账号的日常与周期任务；Windows 桌面版加离线 PWA，两端通过备份迁移数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0e1a2f"/>
      <stop offset="1" stop-color="#0a2b36"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="410" height="210" rx="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", "Microsoft YaHei", "PingFang SC", monospace; }
  </style>
  <g clip-path="url(#card)">
    <rect width="410" height="210" fill="url(#bg)"/>
    <rect width="410" height="210" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="409" height="209" rx="14" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>
  <rect x="24" y="44" width="362" height="1.5" fill="url(#line)"/>
  <text x="24" y="32" class="mono" font-size="13" fill="#64748b">~/projects/leylinebook</text>
  <text x="386" y="32" class="mono" font-size="13" fill="#64748b" text-anchor="end">● JavaScript</text>
  <text x="24" y="76" class="sans" font-size="24" font-weight="700" fill="#e2e8f0">LeyLineBook</text>
  <text x="24" y="99" class="sans" font-size="15" fill="#94a3b8">地脉簿 · 多账号任务管理</text>
  <text x="386" y="78" class="mono" font-size="32" font-weight="700" fill="#38bdf8" text-anchor="end">PWA</text>
  <text x="386" y="99" class="mono" font-size="12" fill="#64748b" text-anchor="end">+ Windows 桌面版</text>
  <text x="24" y="130" class="sans" font-size="15" fill="#cbd5e1">在电脑和手机上管理多个《原神》账号的</text>
  <text x="24" y="152" class="sans" font-size="15" fill="#cbd5e1">日常与周期任务；两端通过备份迁移数据</text>
