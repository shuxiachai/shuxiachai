<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210" role="img" aria-labelledby="t d">
  <title id="t">AgentScope · 10 merged PRs</title>
  <desc id="d">AgentScope：3 万+ Star 的多智能体框架，10 个已合并 PR。修复 RAG 文档解析、向量检索和工具 Schema 推断中的边界问题，以及实时 Agent 测试的稳定性。</desc>
  <defs>
