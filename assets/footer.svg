<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">status.yml</title>
  <desc id="desc">面向 2027 届 AI Agent、LLM 应用、Agent 平台与 AI 后端工程岗位；所在地 Sydney → 深圳；使用问题与改进建议欢迎提交到对应项目的 Issues。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0e1a2f"/>
      <stop offset="1" stop-color="#0a2b36"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", "Microsoft YaHei", "PingFang SC", monospace; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <rect width="1200" height="200" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="18" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>
  <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="6" fill="#febc2e"/>
  <circle cx="80" cy="32" r="6" fill="#28c840"/>
  <text x="104" y="37" class="mono" font-size="14" fill="#64748b">shuxiachai@github: ~/status</text>
  <text x="48" y="80" class="mono" font-size="18" fill="#e2e8f0"><tspan fill="#22d3ee">$</tspan> cat status.yml</text>
  <text x="48" y="110" class="mono" font-size="18" fill="#e2e8f0"><tspan fill="#a78bfa">open_to:</tspan>  2027 new-grad · AI Agent · LLM Apps · Agent Platform · AI Backend</text>
  <text x="48" y="136" class="mono" font-size="18" fill="#e2e8f0"><tspan fill="#a78bfa">location:</tspan> Sydney → Shenzhen</text>
  <text x="48" y="162" class="mono" font-size="18" fill="#e2e8f0"><tspan fill="#a78bfa">feedback:</tspan> issues &amp; ideas welcome on each project</text>
  <text x="48" y="188" class="mono" font-size="18" fill="#22d3ee">$ <tspan class="cursor">▋</tspan></text>
  <text x="1160" y="188" class="mono" font-size="14" fill="#475569" text-anchor="end">-- end of README --</text>
</svg>
